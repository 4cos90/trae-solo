<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>几何冲刺 - Geometric Dash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0f;
            --primary: #00d4ff;
            --danger: #ff006e;
            --gold: #ffd700;
            --text: #ffffff;
            --text-dim: #666677;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            color: var(--text);
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9 / 16;
            max-height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 15, 0.9);
            opacity: 1;
            transition: opacity 0.3s ease;
            pointer-events: auto;
            border-radius: 8px;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, var(--primary), var(--text));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.5);
        }

        .subtitle {
            font-size: clamp(0.8rem, 3vw, 1rem);
            color: var(--text-dim);
            letter-spacing: 0.3em;
            margin-bottom: 3rem;
        }

        .score-display {
            font-family: 'Space Mono', monospace;
            font-size: clamp(1rem, 4vw, 1.5rem);
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .score-display span {
            color: var(--gold);
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1rem, 4vw, 1.25rem);
            font-weight: 700;
            padding: 1rem 3rem;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: var(--primary);
            color: var(--bg-color);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .countdown {
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 50px rgba(0, 212, 255, 0.8);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .game-over-content {
            text-align: center;
        }

        .game-over-title {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            font-weight: 700;
            color: var(--danger);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .final-score {
            font-family: 'Space Mono', monospace;
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 700;
            color: var(--text);
            margin: 1rem 0;
        }

        .final-score span {
            color: var(--gold);
        }

        .high-score-badge {
            font-size: clamp(0.8rem, 3vw, 1rem);
            color: var(--gold);
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .high-score-badge.show {
            opacity: 1;
            transform: translateY(0);
        }

        .instructions {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: clamp(0.7rem, 2.5vw, 0.9rem);
            color: var(--text-dim);
            letter-spacing: 0.1em;
        }

        .hud {
            position: absolute;
            top: 1rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 1rem;
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .hud.show {
            opacity: 1;
        }

        .hud-score {
            color: var(--primary);
        }

        .hud-high {
            color: var(--text-dim);
        }

        @media (max-width: 480px) {
            .game-container {
                max-height: 100vh;
                border-radius: 0;
            }
            canvas {
                border-radius: 0;
            }
            .overlay {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>

        <div class="hud" id="hud">
            <div class="hud-score">SCORE: <span id="currentScore">0</span></div>
            <div class="hud-high">BEST: <span id="hudHighScore">0</span></div>
        </div>

        <div class="overlay" id="startOverlay">
            <div class="title">几何冲刺</div>
            <div class="subtitle">GEOMETRIC DASH</div>
            <div class="score-display">最高分: <span id="startHighScore">0</span></div>
            <button class="btn" id="startBtn">开始游戏</button>
            <div class="instructions">
                键盘 ← → 或 A D / 点击屏幕左右区域
            </div>
        </div>

        <div class="overlay hidden" id="countdownOverlay">
            <div class="countdown" id="countdownText">3</div>
        </div>

        <div class="overlay hidden" id="gameOverOverlay">
            <div class="game-over-content">
                <div class="game-over-title">游戏结束</div>
                <div class="final-score"><span id="finalScore">0</span></div>
                <div class="high-score-badge" id="newHighBadge">🎉 新纪录!</div>
                <button class="btn" id="restartBtn">再来一次</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startOverlay = document.getElementById('startOverlay');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const hud = document.getElementById('hud');
        const countdownText = document.getElementById('countdownText');
        const currentScoreEl = document.getElementById('currentScore');
        const finalScoreEl = document.getElementById('finalScore');
        const startHighScoreEl = document.getElementById('startHighScore');
        const hudHighScoreEl = document.getElementById('hudHighScore');
        const newHighBadge = document.getElementById('newHighBadge');

        const COLORS = {
            bg: '#0a0a0f',
            primary: '#00d4ff',
            danger: '#ff006e',
            gold: '#ffd700',
            text: '#ffffff',
            textDim: '#666677',
            trackBg: '#111118'
        };

        const GAME_STATE = {
            IDLE: 'idle',
            COUNTDOWN: 'countdown',
            PLAYING: 'playing',
            GAMEOVER: 'gameover'
        };

        let gameState = GAME_STATE.IDLE;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('geometricDashHighScore')) || 0;
        let gameSpeed = 5;
        let lastTime = 0;
        let deltaTime = 0;

        const LANE_COUNT = 3;
        let laneWidth, trackWidth, trackStartX, playerY;
        let player = { lane: 1, x: 0, targetX: 0, size: 40 };
        let obstacles = [];
        let powerups = [];
        let particles = [];
        let gridOffset = 0;

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            laneWidth = rect.width / LANE_COUNT;
            trackWidth = laneWidth * 0.7;
            trackStartX = (rect.width - laneWidth * LANE_COUNT) / 2;
            playerY = rect.height * 0.75;
            player.size = Math.min(40, laneWidth * 0.5);

            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            const rect = canvas.getBoundingClientRect();
            player.targetX = trackStartX + player.lane * laneWidth + laneWidth / 2;
            if (player.x === 0) player.x = player.targetX;
        }

        function init() {
            resizeCanvas();
            startHighScoreEl.textContent = highScore;
            hudHighScoreEl.textContent = highScore;
            window.addEventListener('resize', resizeCanvas);
            setupControls();
            requestAnimationFrame(gameLoop);
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if (gameState !== GAME_STATE.PLAYING) return;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    movePlayer(-1);
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    movePlayer(1);
                }
            });

            canvas.addEventListener('click', (e) => {
                if (gameState !== GAME_STATE.PLAYING) return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                if (x < rect.width / 2) {
                    movePlayer(-1);
                } else {
                    movePlayer(1);
                }
            });

            canvas.addEventListener('touchstart', (e) => {
                if (gameState !== GAME_STATE.PLAYING) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                if (x < rect.width / 2) {
                    movePlayer(-1);
                } else {
                    movePlayer(1);
                }
            }, { passive: false });

            document.getElementById('startBtn').addEventListener('click', startCountdown);
            document.getElementById('restartBtn').addEventListener('click', startCountdown);
        }

        function movePlayer(dir) {
            const newLane = player.lane + dir;
            if (newLane >= 0 && newLane < LANE_COUNT) {
                player.lane = newLane;
                player.targetX = trackStartX + player.lane * laneWidth + laneWidth / 2;
            }
        }

        function startCountdown() {
            gameState = GAME_STATE.COUNTDOWN;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            countdownOverlay.classList.remove('hidden');
            newHighBadge.classList.remove('show');

            let count = 3;
            countdownText.textContent = count;

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownText.textContent = count;
                } else {
                    clearInterval(countInterval);
                    countdownOverlay.classList.add('hidden');
                    startGame();
                }
            }, 1000);
        }

        function startGame() {
            gameState = GAME_STATE.PLAYING;
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            powerups = [];
            particles = [];
            player.lane = 1;
            updatePlayerPosition();
            hud.classList.add('show');
            hudHighScoreEl.textContent = highScore;
            currentScoreEl.textContent = '0';
        }

        function gameOver() {
            gameState = GAME_STATE.GAMEOVER;
            hud.classList.remove('show');

            const isNewHigh = score > highScore;
            if (isNewHigh) {
                highScore = score;
                localStorage.setItem('geometricDashHighScore', highScore);
            }

            finalScoreEl.textContent = score;
            setTimeout(() => {
                gameOverOverlay.classList.remove('hidden');
                if (isNewHigh && score > 0) {
                    setTimeout(() => newHighBadge.classList.add('show'), 300);
                }
            }, 500);
        }

        function spawnObstacle() {
            const minGap = 180;
            const screenHeight = canvas.getBoundingClientRect().height;
            const spawnY = -80;

            const newestObstacle = obstacles.reduce((newest, obs) => {
                if (!newest || obs.y < newest.y) return obs;
                return newest;
            }, null);

            if (newestObstacle && newestObstacle.y - spawnY < minGap) {
                return;
            }

            const lane = Math.floor(Math.random() * LANE_COUNT);
            obstacles.push({
                lane,
                x: trackStartX + lane * laneWidth + laneWidth / 2,
                y: spawnY,
                size: 70,
                passed: false
            });
        }

        function spawnPowerup() {
            const minGap = 150;
            const spawnY = -50;

            const newestPowerup = powerups.reduce((newest, pu) => {
                if (!newest || pu.y < newest.y) return pu;
                return newest;
            }, null);

            if (newestPowerup && newestPowerup.y - spawnY < minGap) {
                return;
            }

            const lane = Math.floor(Math.random() * LANE_COUNT);
            powerups.push({
                lane,
                x: trackStartX + lane * laneWidth + laneWidth / 2,
                y: spawnY,
                size: 25,
                collected: false,
                glowPhase: Math.random() * Math.PI * 2
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                const angle = (Math.PI * 2 * i) / 20;
                const speed = 3 + Math.random() * 5;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 3 + Math.random() * 4,
                    color,
                    life: 1
                });
            }
        }

        function gameLoop(timestamp) {
            deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            const rect = canvas.getBoundingClientRect();
            const dt = Math.min(deltaTime / 16.67, 2);

            if (gameState === GAME_STATE.PLAYING) {
                player.x += (player.targetX - player.x) * 0.2;

                gridOffset = (gridOffset + gameSpeed * dt) % 50;

                const spawnChance = 0.015 + (gameSpeed - 5) * 0.003;
                if (Math.random() < spawnChance) {
                    spawnObstacle();
                }
                if (Math.random() < 0.006) {
                    spawnPowerup();
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.y += gameSpeed * dt;

                    if (!obs.passed && obs.y > playerY + player.size) {
                        obs.passed = true;
                        score += 10;
                        currentScoreEl.textContent = score;
                    }

                    if (obs.y > rect.height + 100) {
                        obstacles.splice(i, 1);
                        continue;
                    }

                    const dx = Math.abs(player.x - obs.x);
                    const dy = Math.abs(playerY - obs.y);
                    if (dx < (player.size + obs.size) / 2 - 10 && dy < (player.size + obs.size) / 2 - 10) {
                        createExplosion(player.x, playerY, COLORS.danger);
                        gameOver();
                        return;
                    }
                }

                for (let i = powerups.length - 1; i >= 0; i--) {
                    const pu = powerups[i];
                    pu.y += gameSpeed * dt;
                    pu.glowPhase += 0.1;

                    if (pu.y > rect.height + 50) {
                        powerups.splice(i, 1);
                        continue;
                    }

                    const dx = Math.abs(player.x - pu.x);
                    const dy = Math.abs(playerY - pu.y);
                    if (dx < (player.size + pu.size) / 2 && dy < (player.size + pu.size) / 2) {
                        pu.collected = true;
                        score += 50;
                        currentScoreEl.textContent = score;
                        createExplosion(pu.x, pu.y, COLORS.gold);
                        powerups.splice(i, 1);
                    }
                }

                gameSpeed = Math.min(5 + score / 50, 15);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.size *= 0.98;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function render() {
            const rect = canvas.getBoundingClientRect();
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, rect.width, rect.height);

            ctx.strokeStyle = COLORS.textDim;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.1;
            for (let y = gridOffset; y < rect.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(rect.width, y);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            for (let i = 0; i < LANE_COUNT; i++) {
                const x = trackStartX + i * laneWidth + laneWidth / 2;
                ctx.fillStyle = COLORS.trackBg;
                ctx.fillRect(x - trackWidth / 2, 0, trackWidth, rect.height);
            }

            for (let i = 0; i <= LANE_COUNT; i++) {
                const x = trackStartX + i * laneWidth;
                ctx.strokeStyle = COLORS.textDim;
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, rect.height);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            obstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.x, obs.y);
                ctx.rotate(Math.PI / 4);

                ctx.shadowColor = COLORS.danger;
                ctx.shadowBlur = 20;
                ctx.fillStyle = COLORS.danger;
                ctx.fillRect(-obs.size / 2, -obs.size / 2, obs.size, obs.size);

                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ff4488';
                ctx.lineWidth = 3;
                ctx.strokeRect(-obs.size / 2 + 5, -obs.size / 2 + 5, obs.size - 10, obs.size - 10);
                ctx.restore();
            });

            powerups.forEach(pu => {
                const glow = 0.7 + Math.sin(pu.glowPhase) * 0.3;
                ctx.save();
                ctx.globalAlpha = glow;
                ctx.shadowColor = COLORS.gold;
                ctx.shadowBlur = 25;
                ctx.fillStyle = COLORS.gold;
                ctx.beginPath();
                ctx.arc(pu.x, pu.y, pu.size / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(pu.x, pu.y, pu.size / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            if (gameState === GAME_STATE.PLAYING || gameState === GAME_STATE.COUNTDOWN) {
                ctx.save();
                ctx.shadowColor = COLORS.primary;
                ctx.shadowBlur = 30;
                ctx.fillStyle = COLORS.primary;
                ctx.beginPath();
                ctx.arc(player.x, playerY, player.size / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x, playerY, player.size / 2 - 5, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(player.x - 8, playerY - 8, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        init();
    </script>
</body>
</html>
